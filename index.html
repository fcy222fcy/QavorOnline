<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(() => {
        const saved = window.localStorage.getItem('qavor-theme')
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%qavor-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qavor — Build, Run and Observe AI Agents</title>
    <meta
      name="description"
      content="Qavor 是一个面向开发者的 AI Agent 平台，集成 Agent 编排、RAG 知识库、Tool Calling、Agent Trace 与 RAG Evaluation。基于 Go + Vue 3 构建。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
